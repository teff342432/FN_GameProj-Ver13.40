name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect repository
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f \( -name configure -o -name configure.ac -o -name Makefile -o -name Makefile.am -o -name CMakeLists.txt \)

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config

      - name: Configure
        run: |
          if [ -x ./configure ]; then
            ./configure
          elif [ -f ./configure ]; then
            chmod +x ./configure
            ./configure
          elif [ -f ./configure.ac ] || [ -f ./configure.in ]; then
            autoreconf -fi
            ./configure
          else
            echo "ERRO: não existe ./configure nem configure.ac na raiz."
            echo "Verifique a estrutura do repositório e o sistema de build."
            exit 1
          fi

      - name: Make
        run: make

      - name: Make check
        run: make check
